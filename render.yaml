services:
  - type: web
    name: haat
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: sh scripts/start.sh
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:../storage/app.db
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
